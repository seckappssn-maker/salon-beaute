<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';document.head.appendChild(s)"></script>
<style>
/* Layout: colonna unica da telefono, banda prugna con filo rame in alto, barra schede in basso */
:root{
  --bg:#F3EEF1; --surface:#FFFFFF; --surface2:#F9F5F7; --ink:#25121F; --muted:#6E5868; --line:#E6D9E1;
  --indigo:#6A1F5A; --indigo-ink:#FFFFFF; --band:#3D1035; --band-ink:#FFF1F7;
  --gold:#A8532E; --gold-soft:#F9E4D8; --gold-line:#E39B74;
  --ok:#1D7348; --ok-soft:#DDF2E6; --warn:#A85A07; --warn-soft:#FBEBD5; --bad:#B42318; --bad-soft:#FBE1DE;
  --chip:#F0E4EB; --shadow:0 1px 2px rgba(37,18,31,.06),0 4px 14px rgba(37,18,31,.06);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140A12; --surface:#1F121C; --surface2:#281725; --ink:#F6EAF1; --muted:#BCA4B4; --line:#3B2536;
  --indigo:#E7A6D6; --indigo-ink:#140A12; --band:#2B0C25; --band-ink:#FFF1F7;
  --gold:#F2A983; --gold-soft:#3B2218; --gold-line:#E39B74;
  --ok:#5ACB92; --ok-soft:#163626; --warn:#F2A54A; --warn-soft:#3B2711; --bad:#F2786C; --bad-soft:#3D1A18;
  --chip:#2F1C2B; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140A12; --surface:#1F121C; --surface2:#281725; --ink:#F6EAF1; --muted:#BCA4B4; --line:#3B2536;
  --indigo:#E7A6D6; --indigo-ink:#140A12; --band:#2B0C25; --band-ink:#FFF1F7;
  --gold:#F2A983; --gold-soft:#3B2218; --gold-line:#E39B74;
  --ok:#5ACB92; --ok-soft:#163626; --warn:#F2A54A; --warn-soft:#3B2711; --bad:#F2786C; --bad-soft:#3D1A18;
  --chip:#2F1C2B; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.aname{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stitch{height:0;border-top:2px solid var(--gold-line);opacity:.9}
.mode{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;flex:none}
.mode button{border:0;background:none;color:var(--band-ink);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600}
.mode button.on{background:var(--gold-line);color:#1B1606}
main{padding-block:16px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:24px;line-height:1.15}
h2{font-size:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.fete{background:var(--gold-soft);border:1.5px dashed var(--gold-line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.fete b{font-family:var(--f-display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.thumb{width:48px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--indigo);flex:none}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.st-coupe,.st-couture,.st-finition{background:var(--warn-soft);color:var(--warn)}
.st-pret{background:var(--ok-soft);color:var(--ok)}
.st-recu{background:var(--chip);color:var(--indigo)}
.st-livre{background:var(--chip);color:var(--muted)}
.reste{font-size:12.5px;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.solde{font-size:12.5px;font-weight:700;color:var(--ok)}
.bad{color:var(--bad)!important;font-weight:600}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--indigo);color:var(--indigo-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.gold{background:var(--gold-line);color:#1B1606}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--indigo);color:var(--indigo-ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--indigo)}
nav.tabs svg{width:23px;height:23px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* catalogue */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--chip);max-width:100%}
.card-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card-t{font-weight:700;font-size:14.5px;line-height:1.25}
.price{font-family:var(--f-display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.tag{position:absolute;top:8px;left:8px;background:var(--gold-line);color:#1B1606;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.hbtn{border:1px solid rgba(255,255,255,.3);background:none;color:var(--band-ink);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.hchip{border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);color:var(--band-ink);white-space:nowrap}
.hchip.ok{background:#1F7A4D;color:#fff}.hchip.warn{background:var(--gold-line);color:#1B1606}.hchip.bad{background:#C0392B;color:#fff}
.sync{font-size:12px;opacity:.85;white-space:nowrap}.sync.err{color:#FFB4A9;opacity:1}
.code{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--gold)}
.linkbox{background:var(--surface2);border:1px dashed var(--gold-line);border-radius:10px;padding:10px 12px;font-size:13.5px;word-break:break-all;user-select:all}
.imgw{position:relative}
.pcount{position:absolute;bottom:8px;right:8px;background:rgba(10,12,30,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcell{position:relative;aspect-ratio:4/5;max-width:100%}
.pcell img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.pcover{position:absolute;left:5px;bottom:5px;background:var(--gold-line);color:#1B1606;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}
.pdel,.pmove{position:absolute;top:5px;border:0;width:28px;height:28px;border-radius:50%;background:rgba(10,12,30,.72);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.pdel{right:5px}.pmove{left:5px;font-size:13px}
.padd{aspect-ratio:4/5;max-width:100%;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;text-align:center;padding:4px}
.padd span{font-size:28px;line-height:1;color:var(--indigo)}
.padd small{font-size:11.5px;font-weight:600}
.gal{position:relative;border-radius:14px;overflow:hidden;background:var(--chip)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:0 0 100%;width:100%;max-height:380px;object-fit:contain;scroll-snap-align:center}
.gal-n{position:absolute;top:10px;right:10px;background:rgba(10,12,30,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dots i.on{background:#fff;width:18px;border-radius:9px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,6,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mes{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.mes .f input{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv b{font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.money b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.money span{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.step{border:0;background:var(--chip);border-radius:9px;padding:8px 2px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.step i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5}
.step.done{background:var(--indigo);color:var(--indigo-ink)}
.step.done i{opacity:1}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-line);border-radius:9px}
.photo-big{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:var(--chip)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:64px;height:76px;object-fit:cover;border-radius:10px}
.msg{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.reply{background:var(--gold-soft);border-radius:10px;padding:8px 11px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:96px}
.act svg{width:26px;height:26px;color:var(--gold)}
.act b{font-size:14.5px}
.act span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px;max-width:90%}
.note{font-size:12.5px;color:var(--muted)}
.hello{display:flex;flex-direction:column;gap:4px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
<style>
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{border:0;background:var(--surface);border-radius:12px;padding:7px 0;min-width:50px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);flex:none}
.day small{font-size:11px;color:var(--muted);text-transform:capitalize}
.day b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--gold-line)}
.day.on{background:var(--indigo);color:var(--indigo-ink)}.day.on small{color:inherit;opacity:.8}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:stretch}
.slot .t{font-family:var(--f-display);font-weight:700;font-size:15px;padding-top:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.rdv{border:0;background:var(--surface);border-radius:14px;padding:11px 13px;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);border-left:4px solid var(--line);width:100%;min-width:0}
.rdv.prevu{border-left-color:var(--indigo)}.rdv.arrive{border-left-color:var(--warn)}.rdv.termine{border-left-color:var(--ok)}.rdv.absent,.rdv.annule{border-left-color:var(--bad);opacity:.6}
.timeline{display:flex;flex-direction:column;gap:8px}
.st-prevu{background:var(--chip);color:var(--indigo)}.st-arrive{background:var(--warn-soft);color:var(--warn)}.st-termine{background:var(--ok-soft);color:var(--ok)}.st-absent,.st-annule{background:var(--bad-soft);color:var(--bad)}
.big-total{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.navd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navd .x{font-size:16px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-b{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700;font-size:13.5px}
.mode-b.on{border-color:var(--indigo);background:var(--indigo);color:var(--indigo-ink)}
.svc-pick{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.svc-pick label{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:14px}
.svc-pick label span{flex:1;min-width:0}
.svc-pick input{width:22px!important;height:22px;flex:none;margin:0}
[hidden]{display:none!important}
.svc-pick label b{font-variant-numeric:tabular-nums;font-size:13px}
.line-row{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;align-items:center}
.line-row input{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 10px;min-width:0;width:100%;font-size:15px}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{width:30px;height:30px;border-radius:50%;border:2px dashed var(--gold-line);display:grid;place-items:center;font-size:13px;color:var(--gold)}
.stamp.on{background:var(--gold-line);border-style:solid;color:#2A0E20}
.bar-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-row .bar{height:10px}
.cat-ic{width:48px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--chip)}
</style>

/* ---------- utils ---------- */

function fixState(o){if(!o)return o;['clients','prestations','rdv','ventes','equipe'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});if(!Array.isArray(o.demandes))o.demandes=[];

  fr.readAsDataURL(file)}

function render(){

    ?[['accueil','Accueil',I.home,nNew],['agenda','Agenda',I.cal],['caisse','Caisse',I.cash],['clients','Clients',I.users],['services','Services',I.svc]]
    :[['c-services','Services',I.svc],['c-accueil','Mon espace',I.home],['c-messages','Messages',I.msg]];
  $('#tabs').innerHTML=tabs.map(([k,l,ic,b])=>`<button class="${view===k?'on':''}" data-act="tab" data-v="${k}" aria-label="${l}">${ic}<span>${l}</span>${b?`<span class="badge">${b}</span>`:''}</button>`).join('');

}

const sum=a=>a.reduce((x,v)=>x+num(v.total),0);

function rdvCard(r,showDate){const e=emp(r.employeId);

function timeline(list){return list.length?`<div class="timeline">${list.map(r=>`<div class="slot"><div class="t">${esc(r.heure)}</div>${rdvCard(r)}</div>`).join('')}</div>`:''}

  const t=today(),rl=dayRdv(t).filter(r=>r.statut!=='annule'),rest=rl.filter(r=>r.statut==='prevu'||r.statut==='arrive');

function agenda(){

    strip.push(`<button class="day ${d===agDay?'on':''} ${has?'has':''}" data-act="ag-day" data-v="${d}"><small>${dateFr(d,{weekday:'short'}).replace('.','')}</small><b>${new Date(d+'T12:00').getDate()}</b><i></i></button>`)}
  const rl=dayRdv(agDay);
  return `<div class="sec-h"><h1>Agenda</h1><button class="btn sm" data-act="new-rdv">+ Rendez-vous</button></div>
  <div class="days" id="days">${strip.join('')}</div>

function caisse(){

  const byEmp=(S.equipe||[]).map(e=>[e.nom,sum(vs.filter(v=>v.employeId===e.id))]).filter(x=>x[1]>0);const mx=Math.max(1,...byEmp.map(x=>x[1]));
  const wk=sum(S.ventes.filter(v=>daysTo(v.date)<=0&&daysTo(v.date)>-7)),mo=sum(S.ventes.filter(v=>v.date.slice(0,7)===today().slice(0,7)));
  return `<div class="sec-h"><h1>Caisse</h1><button class="btn sm gold" data-act="encaisser">+ Encaisser</button></div>
  <div class="navd"><button class="x" data-act="ca-shift" data-v="-1" aria-label="Jour précédent">‹</button><h2 style="text-transform:capitalize">${dayLabel(caDay)}</h2><button class="x" data-act="ca-shift" data-v="1" aria-label="Jour suivant" ${caDay>=today()?'disabled style="opacity:.3"':''}>›</button></div>

  <div class="money">${byMode.map(([m,v])=>`<div><b>${fmt(v)}</b><span>${m}</span></div>`).join('')}</div></div>

  <div class="list">${vs.length?vs.map(v=>`<button class="row" data-act="vente" data-id="${v.id}"><div class="av">${initials(venteNom(v))}</div><div class="row-main"><div class="row-t">${esc(venteNom(v))}</div><div class="row-s">${esc(v.lignes.map(l=>l.nom).join(' + '))}</div><div class="row-s">${esc(v.heure||'')} · ${esc(v.mode)}${emp(v.employeId)?' · '+esc(emp(v.employeId).nom):''}</div></div><div class="row-end"><b style="font-variant-numeric:tabular-nums">${fmt(v.total)}</b></div></button>`).join(''):'<div class="empty">Rien encaissé ce jour.</div>'}</div>

function saveRdv(id,demId){

  if(!cid)return toast('Choisissez un client');
  const ps=picked('rf');if(!ps.length)return toast('Choisissez au moins un service');

  const data={clientId:cid,nom:'',date:val('rf-date')||today(),heure:val('rf-h'),services:ps.map(p=>({id:p.id,nom:p.nom,prix:p.prix})),duree:ps.reduce((a,p)=>a+(+p.duree||30),0),prix,employeId:val('rf-emp'),note:val('rf-note')};
  const clash=S.rdv.find(x=>x.id!==id&&x.date===data.date&&data.employeId&&x.employeId===data.employeId&&(x.statut==='prevu'||x.statut==='arrive')&&toMin(x.heure)<toMin(data.heure)+data.duree&&toMin(data.heure)<toMin(x.heure)+(x.duree||30));

}

function licState(){const L=LIC||{};const end=[L.trial_end,L.paid_until].filter(Boolean).sort().pop()||today();const left=daysTo(end);const trial=!L.paid_until||L.trial_end>=L.paid_until;
  if(left>=0)return{st:left<=5?'warn':'ok',left,end,trial};if(-left<=GRACE_DAYS)return{st:'grace',left,end,trial};return{st:'blocked',left,end,trial}}
const WRITE=new Set(['new-rdv','new-rdv-for','edit-rdv','save-rdv','rdv-st','del-rdv','encaisser','en-save','del-vente','new-client','edit-client','save-client','new-code','del-client','new-svc','edit-svc','save-svc','del-svc','dem-reply','dem-ok','save-settings','add-emp','del-emp']);
function blockedAct(a){if(!LIC||!WRITE.has(a)||licState().st!=='blocked')return false;toast(tr('Abonnement terminé : vous pouvez regarder, pas modifier'));aboSheet();return true}

/* ---------- photos ---------- */
function dataToBlob(u){const [h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'})}
async function upPhoto(u,folder){if(!ONLINE||!SB||!u||!/^data:image\/(jpeg|png|webp)/.test(u))return u;
  const path=folder+'/'+Date.now().toString(36)+uid()+'.jpg';
  try{const r=await SB.storage.from('salon').upload(path,dataToBlob(u),{contentType:'image/jpeg',upsert:false});if(r.error)throw r.error;return SB.storage.from('salon').getPublicUrl(path).data.publicUrl}
  catch(e){return PORTAL?null:u}}

/* ---------- en-tête ---------- */
function langBtn(){return `<button class="hbtn" data-act="lang" aria-label="Langue">${LANG==='wo'?'FR':'WO'}</button>`}
function renderHdr(){const h=document.getElementById('hdrR');if(!h)return;
  if(!ONLINE){h.innerHTML=`<div style="display:flex;gap:6px;align-items:center">${langBtn()}<div class="mode" role="tablist" aria-label="Mode"><button class="${mode==='salon'?'on':''}" data-act="mode" data-v="salon">Salon</button><button class="${mode==='client'?'on':''}" data-act="mode" data-v="client">Client</button></div></div>`;return}
  if(PORTAL||!USER||!S){h.innerHTML=langBtn();return}
  const L=licState();let lab,cls;
  if(!LIC){lab='☁';cls=''}else if(L.st==='blocked'){lab='Abonnement expiré';cls='bad'}else if(L.st==='grace'){lab='Expiré · '+(GRACE_DAYS+L.left)+' j';cls='bad'}
  else if(L.st==='warn'){lab=(L.trial?'Essai':'Abonné')+' · '+L.left+' j';cls='warn'}else{lab=L.trial?'Essai gratuit':'Abonné';cls='ok'}
  h.innerHTML=`<div style="display:flex;gap:6px;align-items:center"><span id="syncDot" class="sync ${syncSt}">${syncSt==='ok'?'☁ ✓':syncSt==='err'?'☁ !':'☁ …'}</span>${langBtn()}<button class="hchip ${cls}" data-act="abo">${lab}</button></div>`}

/* ---------- écrans sans données ---------- */
function onlineScreen(){
  const show=html=>{$('#main').innerHTML=html;$('#tabs').innerHTML='';renderHdr();applyLang();return true};
  if(BOOT)return show('<div class="empty" style="padding-top:30vh">Chargement…</div>');
  if(PERR&&!S)return show(`<div class="empty" style="padding-top:20vh">${esc(PERR)}</div>`);
  if(PORTAL){$('#aname').textContent=S.salon.nom;if(PUB&&!PUB.actif)return show(`<div class="panel" style="margin-top:20px"><h2>Réservations fermées pour le moment</h2><p class="muted" style="margin:0">Écrivez directement au salon.</p>${S.salon.tel?`<a class="btn wa" href="${waLink(S.salon.tel,'Bonjour '+S.salon.nom+', ')}" target="_blank" rel="noopener">${I.wa} WhatsApp du salon</a>`:''}</div>`);return false}
  if(!USER){$('#aname').textContent='Salon Beauté';return show(vLogin())}
  if(!S)return show('<div class="empty" style="padding-top:30vh">Chargement…</div>');
  return false}

/* ---------- connexion de l'atelier ---------- */
function vLogin(){const su=AUTHM==='signup';
  return `<div class="hello" style="padding-top:6px"><h1>${su?'Créer mon salon':'Se connecter'}</h1><p class="muted" style="margin:0">Vos rendez-vous, votre caisse, vos clients et vos services sont sauvegardés en ligne, même si vous changez de téléphone.${su?' <b>7 jours gratuits.</b>':''}</p></div>
  <div class="panel"><div class="chips"><button class="chip ${su?'':'on'}" data-act="authm" data-v="login">Se connecter</button><button class="chip ${su?'on':''}" data-act="authm" data-v="signup">Créer un compte</button></div>
  ${su?`<div class="f"><label for="au-nom">Nom du salon</label><input id="au-nom" placeholder="ex. Salon Teranga Beauté"></div><div class="f"><label for="au-ville">Ville</label><input id="au-ville" placeholder="ex. Dakar"></div>`:''}
  <div class="f"><label for="au-tel">Numéro de téléphone</label><input id="au-tel" inputmode="tel" autocomplete="username" placeholder="77 000 00 00"></div>
  <div class="f"><label for="au-pw">Mot de passe</label><input id="au-pw" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="6 caractères minimum"></div>
  ${su?'<div class="f"><label for="au-pw2">Répéter le mot de passe</label><input id="au-pw2" type="password" autocomplete="new-password"></div><div class="note">Notez bien votre mot de passe : il faudra le même sur un nouveau téléphone.</div>':''}
  <button class="btn block" data-act="auth" id="au-btn">${su?'Créer mon salon':'Se connecter'}</button><div class="small bad" id="au-msg" role="status"></div></div>
  <p class="note" style="text-align:center">Besoin d’aide ? WhatsApp Seck Apps : ${SECK_WA}</p>`}
async function doAuth(btn){const su=AUTHM==='signup',ph=phoneDigits(val('au-tel')),pw=$('#au-pw').value;const say=t=>{const m=$('#au-msg');if(m)m.textContent=tr(t)};
  if(ph.length<12)return say('Numéro de téléphone invalide');if(pw.length<6)return say('Le mot de passe doit avoir au moins 6 caractères');
  if(su&&pw!==$('#au-pw2').value)return say('Les deux mots de passe ne sont pas pareils');
  const nom=su?val('au-nom'):'',ville=su?val('au-ville'):'';if(su&&!nom)return say('Écrivez le nom de votre salon');
  btn.disabled=true;btn.textContent=tr('Connexion…');say('');
  try{const email=ph+MAIL_DOM;const r=su?await SB.auth.signUp({email,password:pw}):await SB.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;if(!r.data.session){btn.disabled=false;btn.textContent=tr(su?'Créer mon salon':'Se connecter');return say('Compte créé mais pas encore actif. Contactez Seck Apps.')}
    USER=r.data.session.user;S=loadLocal();if(S&&S.uid!==USER.id)S=null;
    if(su){S=newState(nom,ville,ph.slice(3).replace(/(\d\d)(\d{3})(\d\d)(\d\d)/,'$1 $2 $3 $4'));S.uid=USER.id;saveOnline()}
    await afterLogin();if(su){toast(tr('Bienvenue ! 7 jours gratuits'))}}
  catch(e){const m=String(e&&e.message||'');btn.disabled=false;btn.textContent=tr(su?'Créer mon salon':'Se connecter');
    say(/already|registered|exists/i.test(m)?'Ce numéro a déjà un compte : appuyez sur « Se connecter »':/invalid login|credentials/i.test(m)?'Numéro ou mot de passe faux':errTxt(e))}}
async function afterLogin(){try{await cloudCheck()}catch(e){setSync('err')}
  if(!S){S=newState('Mon salon','',userPhone());S.uid=USER.id;saveOnline()}
  try{await fetchLic()}catch(e){}try{await loadDem()}catch(e){}view='accueil';mode='salon';render()}
async function doLogout(){if(isDirty()){await push();if(isDirty())return toast(tr('Pas encore sauvegardé en ligne : connectez-vous à internet avant de sortir'))}
  try{await SB.auth.signOut()}catch(e){}USER=null;S=null;LIC=null;try{localStorage.removeItem(LKEY);localStorage.removeItem(LKEY+'.lic')}catch(e){}setDirty(false);closeSheet();render()}

/* ---------- réglages en ligne & abonnement ---------- */
function onlineSettings(){const L=licState();const link=portalLink();
  const share=`Réservez chez ${S.salon.nom} : nos services, nos prix et les rendez-vous ici :\n${link}`;
  return `<div class="panel"><h3>Lien de votre salon</h3><div class="small muted">Vos clients y voient vos services et vos prix, et réservent. Mettez-le dans votre statut WhatsApp, TikTok ou Facebook.</div><div class="linkbox" id="lnk">${esc(link)}</div>
  <div class="btns"><button class="btn ghost sm" data-act="copy" data-v="${esc(link)}">Copier le lien</button><a class="btn wa sm" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">${I.wa} Partager</a></div></div>
  <div class="panel"><div class="sec-h"><h3>Abonnement</h3><button class="btn sm ghost" data-act="abo">Voir</button></div><div class="small muted">${LIC?(L.trial?'Essai gratuit':'Abonné')+' jusqu’au '+dateFr(L.end,{day:'numeric',month:'long',year:'numeric'}):'—'} · code salon <b>${esc(S.shopId)}</b></div></div>
  <div class="panel"><h3>Compte</h3><div class="small muted">Connecté : ${esc(userPhone())} · <span id="syncTxt">${syncSt==='ok'?'Sauvegardé en ligne':syncSt==='err'?'Pas encore envoyé : vérifiez internet':'Envoi en cours…'}</span></div>
  <div class="f"><label for="new-pw">Nouveau mot de passe</label><input id="new-pw" type="password" autocomplete="new-password" placeholder="6 caractères minimum"></div><button class="btn ghost" data-act="chg-pw">Changer le mot de passe</button>
  <button class="btn danger" data-act="logout">Se déconnecter</button></div>`}
function aboSheet(){const L=licState();const st=!LIC?'—':L.st==='blocked'?'Abonnement expiré':L.st==='grace'?'Expiré : bloqué dans '+(GRACE_DAYS+L.left)+' j':(L.trial?'Essai gratuit':'Abonné')+' · '+L.left+' j restants';
  const msg=`Bonjour Seck Apps, je paie l’abonnement Salon Beauté.\nSalon : ${S.salon.nom}\nCode : ${S.shopId}\nNuméro : ${userPhone()}`;
  sheet('Abonnement',`<div class="panel"><div class="sec-h"><b>${st}</b></div><div class="small muted">Jusqu’au ${dateFr(L.end,{day:'numeric',month:'long',year:'numeric'})}</div>
  <div class="money" style="grid-template-columns:1fr"><div><b>${fmt(ABO_PRIX)}</b><span>par mois</span></div></div>
  <div class="small">1. Envoyez ${fmt(ABO_PRIX)} par <b>Wave</b> ou <b>Orange Money</b> au <b>${SECK_PAY}</b>.<br>2. Envoyez la capture sur WhatsApp avec votre code salon <b>${esc(S.shopId)}</b>.<br>3. Appuyez sur « J’ai payé : vérifier ».</div>
  <a class="btn wa" href="${waLink(SECK_WA,msg)}" target="_blank" rel="noopener">${I.wa} WhatsApp Seck Apps</a><button class="btn gold" data-act="abo-check">J’ai payé : vérifier mon abonnement</button>
  <div class="note">Si l’abonnement n’est pas payé, 3 jours après la fin l’app se bloque : vous voyez vos données mais vous ne pouvez plus modifier, et la page de réservation se ferme. Tout revient dès le paiement.</div></div>`)}

/* ---------- espace client (lien ?a=) ---------- */
async function portalBoot(){SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'salonBeaute.portal'}});
  let r;try{r=await SB.rpc('salon_public',{p_shop:PORTAL})}catch(e){r={error:e}}
  BOOT=false;
  if(r.error){PERR=errTxt(r.error);return render()}
  if(!r.data){PERR='Ce salon est introuvable. Vérifiez le lien.';return render()}
  PUB=r.data;try{document.title=PUB.nom;const mt=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(mt)mt.setAttribute('content',PUB.nom)}catch(e){}
  S={v:1,salon:{nom:PUB.nom||'Salon',tel:PUB.tel||'',ville:PUB.ville||'',adresse:PUB.adresse||'',ouv:PUB.ouv??9,ferm:PUB.ferm??21},
     prestations:(PUB.prestations||[]).map(p=>({...p,photos:p.photos&&p.photos.length?p.photos:(p.photo?[p.photo]:[])})),equipe:PUB.equipe||[],fid:PUB.fid||{actif:false,seuil:10,cadeau:''},
     clients:[],rdv:[],ventes:[],demandes:[]};
  mode='client';view='c-services';
  try{PCRED=JSON.parse(localStorage.getItem(PKEY)||'null')}catch(e){}
  if(PCRED&&await portalLoad(PCRED,true))view='c-accueil';
  render()}
async function portalLoad(cred,silent){let r;try{r=await SB.rpc('salon_client',{p_shop:PORTAL,p_phone:cred.tel,p_code:cred.code})}catch(e){r={error:e}}
  if(r.error){const m=String(r.error.message||'');if(/code incorrect/i.test(m)){PCRED=null;try{localStorage.removeItem(PKEY)}catch(e){}}
    if(!silent)toast(tr(/code incorrect/i.test(m)?'Numéro ou code incorrect':/inactif/i.test(m)?'Espace fermé pour le moment':'Pas de connexion internet : réessayez'));return false}
  PCRED=cred;try{localStorage.setItem(PKEY,JSON.stringify(cred))}catch(e){}
  const d=r.data;S.clients=[{id:d.client.id,nom:d.client.nom||'',tel:d.client.tel||'',visites:+d.client.visites||0,derniere:d.client.derniere||''}];viewAs=d.client.id;
  S.rdv=(d.rdv||[]).map(x=>({...x,services:Array.isArray(x.services)?x.services:[],statut:x.statut||'prevu',heure:x.heure||'',date:x.date||''}));
  S.demandes=(d.demandes||[]).map(rowDem);return true}
function portalLogin(){return `<div class="hello"><div class="lbl">${esc(S.salon.nom)}</div><h1>Mon espace client</h1></div>
  <div class="panel"><p class="small" style="margin:0">Entrez votre numéro et le <b>code</b> que le salon vous a donné. Vous verrez vos rendez-vous, votre carte de fidélité et vos messages.</p>
  <div class="f"><label for="pl-tel">Numéro de téléphone</label><input id="pl-tel" inputmode="tel" autocomplete="tel" placeholder="77 000 00 00"></div>
  <div class="f"><label for="pl-code">Code</label><input id="pl-code" inputmode="numeric" maxlength="6" placeholder="4 chiffres"></div>
  <button class="btn block" data-act="pl-go">Entrer</button></div>
  <div class="panel"><b>Pas encore de code ?</b><span class="small muted">Vous pouvez réserver sans code : appuyez sur « Réserver ». Le salon vous donne votre code à la première visite.</span><button class="btn gold" data-act="c-book">Réserver un rendez-vous</button></div>`}
async function sendDem(d,btn){
  if(!PORTAL){S.demandes.push(d);save();closeSheet();view=mode==='client'?'c-messages':view;render();return toast(tr('Envoyé au salon'))}
  if(btn){btn.disabled=true;btn.textContent=tr('Envoi…')}
  let r;try{r=await SB.rpc('salon_client_send',{p_shop:PORTAL,p_phone:PCRED.tel,p_code:PCRED.code,p_type:d.type,p_texte:d.texte||'',p_svc:d.svcId||'',p_svc_nom:d.svcNom||'',p_rdv_date:d.rdvDate||null,p_rdv_heure:d.rdvHeure||null,p_employe:d.employe||''})}catch(e){r={error:e}}
  if(r.error){if(btn){btn.disabled=false;btn.textContent=tr('Réessayer')}return toast(errTxt(r.error))}
  await portalLoad(PCRED,true);closeSheet();view='c-messages';render();toast(tr(d.type==='rdv'?'Réservation envoyée : le salon va confirmer':'Envoyé au salon'))}
async function sendVisitor(d,btn){
  if(PORTAL){btn.disabled=true;btn.textContent=tr('Envoi…');
    let r;try{r=await SB.rpc('salon_visiteur_demande',{p_shop:PORTAL,p_nom:d.nomV,p_phone:d.telV,p_texte:d.texte||'',p_svc:d.svcId||'',p_svc_nom:d.svcNom||'',p_rdv_date:d.rdvDate||null,p_rdv_heure:d.rdvHeure||null,p_employe:d.employe||''})}catch(e){r={error:e}}
    if(r.error){btn.disabled=false;btn.textContent=tr('Réessayer');return toast(errTxt(r.error))}}
  else{S.demandes.push(d);save()}
  closeSheet();sheet('Réservation envoyée',`<div class="panel"><b>Merci ${esc(d.nomV)} !</b><div>Le salon a reçu votre demande : ${esc(d.svcNom)}, ${esc(dayLabel(d.rdvDate).toLowerCase())} à ${esc(d.rdvHeure)}. Il vous confirme l’heure sur WhatsApp au ${esc(d.telV)}.</div>${S.salon.tel?`<a class="btn wa" href="${waLink(S.salon.tel,'Bonjour '+S.salon.nom+', je viens de réserver '+d.svcNom+' '+dayLabel(d.rdvDate).toLowerCase()+' à '+d.rdvHeure+'. Mon nom : '+d.nomV+'.')}" target="_blank" rel="noopener">${I.wa} Écrire aussi sur WhatsApp</a>`:''}</div>`)}
/* ---------- écran d'accueil du téléphone ---------- */
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_APP=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
function a2hs(){if(!ONLINE||IS_APP)return '';try{if(localStorage.getItem('salonBeaute.a2hs'+PORTAL)==='1')return ''}catch(e){}
  const steps=IS_IOS?'<span>1. Ouvrez ce lien dans <b>Safari</b>.</span><span>2. Appuyez sur <b>Partager</b> (carré avec une flèche).</span><span>3. Choisissez <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</span>'
    :'<span>1. Ouvrez ce lien dans <b>Chrome</b>.</span><span>2. Appuyez sur le menu <b>⋮</b> en haut.</span><span>3. Choisissez <b>« Ajouter à l’écran d’accueil »</b>.</span>';
  return `<div class="panel" style="border:1.5px dashed var(--gold-line)"><b>${PORTAL?'Gardez le salon sur votre téléphone':'Mettez l’app sur l’écran d’accueil'}</b><div class="small" style="display:flex;flex-direction:column;gap:3px">${steps}<span>Ensuite, ouvrez toujours ${PORTAL?'le salon':'l’app'} avec l’icône.</span></div><button class="btn ghost sm" data-act="a2hs-ok" style="align-self:flex-start">C’est fait</button></div>`}
A['a2hs-ok']=()=>{try{localStorage.setItem('salonBeaute.a2hs'+PORTAL,'1')}catch(e){}render()};

/* ---------- démarrage ---------- */
async function onlineBoot(){
  const t0=Date.now();while(!window.supabase&&Date.now()-t0<8000)await new Promise(r=>setTimeout(r,150));
  if(!window.supabase){BOOT=false;PERR='Pas de connexion internet. Vérifiez et rechargez la page.';S=PORTAL?null:loadLocal();if(S&&!PORTAL){USER={id:S.uid,email:''}}return render()}
  if(PORTAL)return portalBoot();
  SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'salonBeaute.auth'}});
  try{const {data}=await SB.auth.getSession();USER=data&&data.session?data.session.user:null}catch(e){USER=null}
  if(!USER){try{const o=JSON.parse(localStorage.getItem('salonBeaute.auth')||'null');if(o&&o.user&&o.user.id)USER=o.user}catch(e){}}
  BOOT=false;if(!USER){S=null;return render()}
  S=loadLocal();if(S&&S.uid&&S.uid!==USER.id)S=null;if(S)S.demandes=[];
  try{LIC=JSON.parse(localStorage.getItem(LKEY+'.lic')||'null')}catch(e){}
  if(S)render();
  await afterLogin();
  const refresh=async()=>{if(!USER||!SB)return;let ch=false;try{if(!isDirty()&&await cloudCheck()==='down')ch=true}catch(e){}try{if(await loadDem())ch=true}catch(e){}try{await fetchLic()}catch(e){}if(ch&&!document.querySelector('.scrim'))render();else renderHdr()};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
  setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000);
  window.addEventListener('online',()=>{if(isDirty())push()})}

Object.assign(A,{
  authm:e=>{AUTHM=e.dataset.v;render()},
  auth:e=>doAuth(e),
  abo:()=>aboSheet(),
  'abo-check':async e=>{e.disabled=true;e.textContent=tr('Vérification…');try{await fetchLic()}catch(err){}const L=licState();closeSheet();render();toast(tr(L.st==='blocked'?'Pas encore de paiement reçu':'Abonnement à jour'))},
  copy:e=>{const t=e.dataset.v;try{navigator.clipboard.writeText(t).then(()=>toast(tr('Lien copié')),()=>selLink())}catch(err){selLink()}},
  'chg-pw':async e=>{const pw=$('#new-pw').value;if(pw.length<6)return toast(tr('6 caractères minimum'));e.disabled=true;const r=await SB.auth.updateUser({password:pw});e.disabled=false;toast(tr(r.error?'Pas changé : vérifiez internet':'Mot de passe changé'))},
  logout:e=>{if(!outArm){outArm=true;e.textContent=tr('Touchez encore pour sortir');return}outArm=false;doLogout()},
  'pl-go':async e=>{const tel=val('pl-tel'),code=val('pl-code');if(tel.replace(/\D/g,'').length<9||code.length<4)return toast(tr('Écrivez votre numéro et votre code'));
    e.disabled=true;e.textContent=tr('Connexion…');const ok=await portalLoad({tel,code});if(!ok){e.disabled=false;e.textContent=tr('Entrer');return}view='c-accueil';render();toast(tr('Bienvenue'))},
  'pl-out':()=>{PCRED=null;try{localStorage.removeItem(PKEY)}catch(e){}S.clients=[];S.rdv=[];S.demandes=[];viewAs=null;view='c-services';render()},
});
function selLink(){const el=$('#lnk');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(tr('Lien sélectionné : copiez-le'))}

if(ONLINE){render();onlineBoot()}else{load();render()}
})();
</script>
